name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36 and Build Tools 36.0.0
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.9 (no committed wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Release builds are never debug-signed."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify APK signature (fail on debug cert)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK" > apksigner.txt 2>&1; then
            echo "::error::apksigner verification failed"
            cat apksigner.txt
            exit 1
          fi
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::APK is signed with the Android DEBUG certificate"
            exit 1
          fi
          grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" apksigner.txt

      - name: Verify AAB signature (fail on debug cert)
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -verify -verbose:summary -certs "$AAB" > jarsigner.txt 2>&1 || { echo "::error::AAB verification failed"; tail -n 20 jarsigner.txt; exit 1; }
          grep -q "jar verified" jarsigner.txt || { echo "::error::AAB is not signed"; exit 1; }
          if grep -q "CN=Android Debug" jarsigner.txt; then
            echo "::error::AAB is signed with the Android DEBUG certificate"
            exit 1
          fi
          echo "AAB signature OK"

      - name: Check for native libraries (16 KB page size)
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          if unzip -l "$AAB" | grep -q '\.so$'; then
            echo "::warning::AAB contains native libraries — verify 16 KB alignment"
          else
            echo "No native libraries: 16 KB page size compatible"
          fi

      - name: Upload release APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: jovial-jewels-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: jovial-jewels-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
